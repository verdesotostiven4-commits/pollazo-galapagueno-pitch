<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ef650c"><title>Pollazo Galapagueño — Pantalla en bucle</title>
<style>
:root{font-family:"Segoe UI",Arial,sans-serif;color:#fff}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e85d08}button,a{font:inherit}body{position:relative}.back{position:fixed;z-index:10;top:18px;left:18px;display:flex;align-items:center;gap:12px;color:white;text-decoration:none;font-size:11px;font-weight:900;letter-spacing:1px;background:#2229;padding:13px 17px;border-radius:10px;backdrop-filter:blur(7px)}#full{position:fixed;z-index:10;top:18px;right:18px;color:white;background:#2229;padding:13px 17px;border:0;border-radius:10px;cursor:pointer;font-size:12px;font-weight:800;backdrop-filter:blur(7px)}.screen{position:absolute;inset:0}.video{width:100%;height:100%;object-fit:cover;display:none;background:#19120e}.screen.ready .video{display:block}.screen.ready .fallback{display:none}.fallback{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 80% 25%,#ffce5b,transparent 40%),linear-gradient(110deg,#ff9e15,#f36509 61%,#d74805);}.fallback:before{content:"";position:absolute;width:70vw;aspect-ratio:1;border:9vw solid #ffffff1b;border-right-color:#ffd85849;border-radius:50%;right:-13vw;top:-25vw;animation:turn 44s linear infinite}.fallback:after{content:"";position:absolute;width:110vw;height:110vw;border-radius:50%;background:#ffffff0b;left:-80vw;bottom:-84vw}.logo{position:absolute;left:8%;top:8%;width:clamp(160px,20vw,360px);background:#fff;border-radius:15px;padding:3px 9px;box-shadow:0 10px 40px #b5440625}.logo img{width:100%;display:block}.caption{position:absolute;top:39%;left:8%;max-width:80%;animation:captions 18s infinite}.caption b{font-size:clamp(13px,2.2vw,28px);letter-spacing:3px}.caption h1{font-weight:900;font-size:clamp(42px,7vw,123px);line-height:.97;letter-spacing:-.07em;margin:12px 0 28px;max-width:1060px}.caption p{font-size:clamp(14px,2vw,27px);font-weight:700;margin:0}.mini{position:absolute;bottom:8%;left:8%;display:flex;gap:15px;align-items:center;font-size:11px;letter-spacing:2px;font-weight:900}.mini i{width:65px;height:3px;background:white}.pending{position:absolute;bottom:8%;right:5%;font-size:9px;letter-spacing:1px;color:#fffd;text-align:right}@keyframes captions{0%,32%{opacity:1;transform:translateY(0)}36%,38%{opacity:0;transform:translateY(-14px)}40%,65%{opacity:1;transform:translateY(0)}69%,71%{opacity:0;transform:translateY(-14px)}73%,99%{opacity:1;transform:translateY(0)}100%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.fallback:before,.caption{animation:none}}
</style></head><body><a class="back" href="./feria.html">← Volver a presentación</a><button id="full" title="Pantalla completa">⛶ Pantalla completa</button><main class="screen" id="screen"><video id="loop" class="video" muted autoplay playsinline loop preload="auto"><source src="./assets/loop-feria.mp4" type="video/mp4"></video><div class="fallback" id="fallback"><div class="logo"><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgPiFlnDAIqYkcjYOq7GqeHClxkSC9yrmNm0UypICcP-HfjzV2zxtWUrPqqYrYgU-acx7q4lHjYuN4qIqrxozuphAsy0Ezq5dhZy0u5ZG5rKH2xC7OKyI-n4HwlhLQ2WZKj6ydM1UOLEKw_LDh04yQEqYU_QuA1OqAB90XfhmZ9fw-Rzkvm4TNRvV180YQ/s1600/image.png" alt="Pollazo Galapagueño"></div><div class="caption" id="caption"><b>POLLAZO GALAPAGUEÑO</b><h1 id="message">La calidad comienza desde el cuidado.</h1><p id="detail">Crianza · Alimentación · Producto</p></div><div class="mini"><i></i><span>UNA HISTORIA DE TRABAJO</span></div><span class="pending">VISTA DE DEMOSTRACIÓN<br>VIDEO DEFINITIVO PENDIENTE</span></div></main>
<script>
(function(){const screen=document.getElementById('screen'),v=document.getElementById('loop');v.addEventListener('loadeddata',()=>{screen.classList.add('ready');v.play().catch(()=>screen.classList.remove('ready'))});v.addEventListener('error',()=>screen.classList.remove('ready'));document.getElementById('full').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.());const copy=[['La calidad comienza desde el cuidado.','Crianza · Alimentación · Producto'],['Cuidar cada etapa importa.','Agua · Alimentación · Supervisión'],['Pollazo Galapagueño.','Conoce nuestra empresa y productos']];let i=0;setInterval(()=>{if(screen.classList.contains('ready'))return;i=(i+1)%copy.length;document.getElementById('message').textContent=copy[i][0];document.getElementById('detail').textContent=copy[i][1]},6000)})();
</script></body></html>
