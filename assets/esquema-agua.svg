<title id="title">Esquema del recorrido del agua y bebedero de tetina</title>
<desc id="desc">Ilustración conceptual, no documental, con tres etapas: equipo de tratamiento por verificar, tuberías de distribución y bebederos de tetina para aves.</desc>
